<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latijn Schema Trainer - Toetsen</title>
<style>
  body { 
    font-family: Arial, sans-serif; 
    display: flex; 
    margin: 0;
    min-height: 100vh;
    background-color: #f4f4f9; 
  }
  .zijbalk {
    width: 250px;
    background-color: #2c3e50;
    color: white;
    padding: 20px;
    box-sizing: border-box;
  }
  .zijbalk h3 {
    margin-top: 0;
    color: #ecf0f1;
  }
  .zijbalk a {
    display: block;
    color: #bdc3c7;
    text-decoration: none;
    padding: 10px 0;
    font-weight: bold;
    font-size: 18px;
  }
  .zijbalk a:hover, .zijbalk a.actief {
    color: #fff;
  }
  .filter-menu {
    margin-top: 30px;
    background: #34495e;
    padding: 15px;
    border-radius: 8px;
  }
  details summary {
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 10px;
  }
  .filter-groep {
    margin-bottom: 15px;
  }
  .filter-groep strong {
    display: block;
    margin-bottom: 5px;
    font-size: 14px;
    color: #bdc3c7;
  }
  label {
    display: block;
    font-size: 14px;
    margin-bottom: 3px;
    cursor: pointer;
  }
  .hoofdinhoud {
    flex: 1;
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    padding: 50px; 
  }
  h2 { 
    color: #333; 
    margin-bottom: 30px;
    text-align: center;
    min-height: 30px;
  }
  .grid { 
    display: grid; 
    grid-template-columns: 1fr 1fr; 
    gap: 20px; 
    width: 100%;
    max-width: 400px; 
    margin-bottom: 30px;
  }
  .column { 
    display: flex; 
    flex-direction: column; 
    gap: 15px; 
  }
  input { 
    padding: 15px; 
    font-size: 20px; 
    text-align: center; 
    border: 2px solid #ccc; 
    border-radius: 8px; 
    outline: none; 
    transition: all 0.2s;
  }
  input:focus {
    border-color: #2196F3;
  }
  input.correct { 
    border-color: #4CAF50; 
    background-color: #e8f5e9; 
    color: #2e7d32;
  }
  input.fout {
    border-color: #f44336; 
    background-color: #ffebee; 
    color: #b71c1c;
  }
  .actie-knop {
    padding: 15px 30px;
    font-size: 18px;
    color: white;
    background-color: #2196F3;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color 0.2s;
  }
  .actie-knop:hover {
    background-color: #1976D2;
  }
  #volgende-knop {
    display: none;
    background-color: #4CAF50;
  }
  #volgende-knop:hover {
    background-color: #388E3C;
  }
</style>
</head>
<body>

<div class="zijbalk">
  <h3>Menu</h3>
  <a href="index.html">Oefenen</a>
  <a href="toets.html" class="actief">Toetsen</a>
  
  <div class="filter-menu">
    <details open>
      <summary>Filters Instellen</summary>
      <div class="filter-groep">
        <strong>Tijden</strong>
        <label><input type="checkbox" name="tijd" value="Praesens" checked> Praesens</label>
        <label><input type="checkbox" name="tijd" value="Imperfectum" checked> Imperfectum</label>
        <label><input type="checkbox" name="tijd" value="Futurum" checked> Futurum</label>
        <label><input type="checkbox" name="tijd" value="Perfectum" checked> Perfectum</label>
        <label><input type="checkbox" name="tijd" value="Plusquamperfectum" checked> Plusquamperfectum</label>
        <label><input type="checkbox" name="tijd" value="Futurum Exactum" checked> Futurum Exactum</label>
      </div>
      <div class="filter-groep">
        <strong>Wijs</strong>
        <label><input type="checkbox" name="wijs" value="Indicativus" checked> Indicativus</label>
        <label><input type="checkbox" name="wijs" value="Conjunctivus" checked> Conjunctivus</label>
      </div>
      <div class="filter-groep">
        <strong>Vorm</strong>
        <label><input type="checkbox" name="vorm" value="Actief" checked> Actief</label>
        <label><input type="checkbox" name="vorm" value="Passief" checked> Passief</label>
      </div>
    </details>
  </div>
</div>

<div class="hoofdinhoud">
  <h2 id="titel">Laden...</h2>

  <div class="grid">
    <div class="column">
      <input type="text" id="input-0" autocomplete="off" placeholder="1e ev">
      <input type="text" id="input-1" autocomplete="off" placeholder="2e ev">
      <input type="text" id="input-2" autocomplete="off" placeholder="3e ev">
    </div>
    <div class="column">
      <input type="text" id="input-3" autocomplete="off" placeholder="1e mv">
      <input type="text" id="input-4" autocomplete="off" placeholder="2e mv">
      <input type="text" id="input-5" autocomplete="off" placeholder="3e mv">
    </div>
  </div>

  <button id="nakijk-knop" class="actie-knop">Nakijken</button>
  <button id="volgende-knop" class="actie-knop">Volgende schema</button>
</div>

<script>
  const schema = {
    "Praesens Indicativus Actief": ["o", "s", "t", "mus", "tis", "nt"],
    "Praesens Conjunctivus Actief": ["m", "s", "t", "mus", "tis", "nt"],
    "Imperfectum Indicativus Actief": ["bam", "bas", "bat", "bamus", "batis", "bant"],
    "Imperfectum Conjunctivus Actief": ["rem", "res", "ret", "remus", "retis", "rent"],
    "Futurum Indicativus Actief": ["bo", "bis", "bit", "bimus", "bitis", "bunt"],
    "Perfectum Indicativus Actief": ["i", "isti", "it", "imus", "istis", "erunt"],
    "Perfectum Conjunctivus Actief": ["erim", "eris", "erit", "erimus", "eritis", "erint"],
    "Plusquamperfectum Indicativus Actief": ["eram", "eras", "erat", "eramus", "eratis", "erant"],
    "Plusquamperfectum Conjunctivus Actief": ["issem", "isses", "isset", "issemus", "issetis", "issent"],
    "Futurum Exactum Indicativus Actief": ["ero", "eris", "erit", "erimus", "eritis", "erint"],
    "Praesens Indicativus Passief": ["or", "ris", "tur", "mur", "mini", "ntur"],
    "Praesens Conjunctivus Passief": ["r", "ris", "tur", "mur", "mini", "ntur"],
    "Imperfectum Indicativus Passief": ["bar", "baris", "batur", "bamur", "bamini", "bantur"],
    "Imperfectum Conjunctivus Passief": ["rer", "reris", "retur", "remur", "remini", "rentur"],
    "Futurum Indicativus Passief": ["bor", "beris", "bitur", "bimur", "bimini", "buntur"],
    "Perfectum Indicativus Passief": ["sum", "es", "est", "sumus", "estis", "sunt"],
    "Perfectum Conjunctivus Passief": ["sim", "sis", "sit", "simus", "sitis", "sint"],
    "Plusquamperfectum Indicativus Passief": ["eram", "eras", "erat", "eramus", "eratis", "erant"],
    "Plusquamperfectum Conjunctivus Passief": ["essem", "esses", "esset", "essemus", "essetis", "essent"],
    "Futurum Exactum Indicativus Passief": ["ero", "eris", "erit", "erimus", "eritis", "erunt"]
  };

  const alleTitels = Object.keys(schema);
  let huidigeTitel = "";
  let huidigeAntwoorden = [];
  const inputs = [];

  for (let i = 0; i < 6; i++) {
    inputs.push(document.getElementById(`input-${i}`));
  }

  const nakijkKnop = document.getElementById('nakijk-knop');
  const volgendeKnop = document.getElementById('volgende-knop');

  function getGefilterdeTitels() {
    const tijden = Array.from(document.querySelectorAll('input[name="tijd"]:checked')).map(cb => cb.value);
    const wijzen = Array.from(document.querySelectorAll('input[name="wijs"]:checked')).map(cb => cb.value);
    const vormen = Array.from(document.querySelectorAll('input[name="vorm"]:checked')).map(cb => cb.value);

    return alleTitels.filter(titel => {
      const heeftTijd = tijden.some(t => {
        if (t === "Futurum") return titel.includes("Futurum") && !titel.includes("Exactum");
        return titel.includes(t);
      });
      const heeftWijs = wijzen.some(w => titel.includes(w));
      const heeftVorm = vormen.some(v => titel.includes(v));
      return heeftTijd && heeftWijs && heeftVorm;
    });
  }

  function startNieuweToets() {
    const gefilterdeTitels = getGefilterdeTitels();
    
    if (gefilterdeTitels.length === 0) {
      document.getElementById('titel').textContent = "Geen schema's gevonden met deze filters!";
      inputs.forEach(input => { input.disabled = true; input.value = ""; input.classList.remove('correct', 'fout'); });
      nakijkKnop.style.display = 'none';
      volgendeKnop.style.display = 'none';
      return;
    }

    huidigeTitel = gefilterdeTitels[Math.floor(Math.random() * gefilterdeTitels.length)];
    huidigeAntwoorden = schema[huidigeTitel];
    document.getElementById('titel').textContent = huidigeTitel;

    inputs.forEach(input => {
      input.value = "";
      input.disabled = false;
      input.classList.remove('correct', 'fout');
    });
    
    nakijkKnop.style.display = 'block';
    volgendeKnop.style.display = 'none';
    inputs[0].focus();
  }

  // Zorg dat de pagina een nieuw schema pakt zodra je de filters aanpast
  document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', startNieuweToets);
  });

  nakijkKnop.addEventListener('click', () => {
    inputs.forEach((input, index) => {
      const ingevuldeWaarde = input.value.trim().toLowerCase();
      input.disabled = true; 
      
      if (ingevuldeWaarde === huidigeAntwoorden[index]) {
        input.classList.add('correct');
      } else {
        input.classList.add('fout');
        input.value = `${input.value} (X: ${huidigeAntwoorden[index]})`;
      }
    });

    nakijkKnop.style.display = 'none';
    volgendeKnop.style.display = 'block';
  });

  volgendeKnop.addEventListener('click', startNieuweToets);

  startNieuweToets();
</script>
</body>
</html>
