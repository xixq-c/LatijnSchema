<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latijn Schema - Oefenen</title>
<style>
  * { box-sizing: border-box; }
  body { 
    font-family: Arial, sans-serif; 
    display: flex; 
    margin: 0;
    min-height: 100vh;
    background-color: #eef2f5;
    color: #333;
  }
  
  /* Mobiele Topbalk */
  .mobiel-header {
    display: none;
    background-color: #2c3e50;
    color: white;
    padding: 15px 20px;
    width: 100%;
    align-items: center;
    position: fixed;
    top: 0; left: 0;
    z-index: 100;
  }
  .hamburger {
    background: none;
    border: none;
    color: white;
    font-size: 24px;
    cursor: pointer;
    padding: 0;
    margin-right: 15px;
  }
  .mobiel-titel {
    font-size: 18px;
    font-weight: bold;
  }

  /* Zijbalk */
  .zijbalk {
    width: 260px;
    background-color: #2c3e50;
    color: white;
    padding: 30px 20px;
    flex-shrink: 0;
    transition: transform 0.3s ease;
    z-index: 200;
  }
  .sluit-menu {
    display: none;
    background: none;
    border: none;
    color: #ecf0f1;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 20px;
    text-align: left;
    padding: 0;
  }
  .zijbalk-nav {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .zijbalk-nav a {
    display: block;
    background-color: #34495e;
    color: #ecf0f1;
    text-decoration: none;
    padding: 12px 15px;
    border-radius: 6px;
    font-weight: bold;
    border: 1px solid #2c3e50;
    transition: 0.2s;
  }
  .zijbalk-nav a:hover { background-color: #3b536b; }
  .zijbalk-nav a.actief {
    background-color: #3498db;
    border-color: #2980b9;
    color: white;
  }
  .filter-menu {
    margin-top: 40px;
    background: #1a252f;
    padding: 15px;
    border-radius: 6px;
  }
  details summary {
    font-weight: bold;
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: center;
    gap: 8px;
    user-select: none;
  }
  details summary::-webkit-details-marker { display: none; }
  .filter-groep {
    margin-top: 15px;
    padding-top: 10px;
    border-top: 1px solid #2c3e50;
  }
  .filter-groep strong {
    display: block;
    margin-bottom: 10px;
    font-size: 13px;
    color: #bdc3c7;
    text-transform: uppercase;
  }
  label {
    display: flex;
    align-items: center;
    font-size: 14px;
    margin-bottom: 8px;
    cursor: pointer;
    color: #ecf0f1;
  }
  label input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border: 2px solid #7f8c8d;
    border-radius: 4px;
    outline: none;
    cursor: pointer;
    position: relative;
    background-color: transparent;
    margin-right: 10px;
    transition: 0.1s;
  }
  label input[type="checkbox"]:checked {
    background-color: #3498db;
    border-color: #3498db;
  }
  label input[type="checkbox"]:checked::after {
    content: '';
    position: absolute;
    left: 4px;
    top: 1px;
    width: 4px;
    height: 9px;
    border: solid white;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  /* Inhoud */
  .hoofdinhoud {
    flex: 1;
    display: flex; 
    flex-direction: column; 
    justify-content: center;
    align-items: center; 
    padding: 20px;
    overflow-x: hidden;
  }
  .leeg-bericht {
    display: none;
    font-size: 24px;
    font-weight: bold;
    color: #cbd5e1;
    text-align: center;
  }
  .oefen-card {
    background: white;
    padding: 30px 40px;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    width: 100%;
    max-width: 500px;
  }
  
  h2 { 
    margin-top: 0;
    margin-bottom: 5px;
    text-align: center;
    font-size: 26px;
    color: #2c3e50;
  }
  .schema-subtitel {
    font-size: 15px;
    font-weight: bold;
    color: #7f8c8d;
    text-align: center;
    margin-bottom: 25px;
  }

  .grid { 
    display: grid; 
    grid-template-columns: 1fr 1fr; 
    gap: 20px; 
    width: 100%;
  }
  .column { 
    display: flex; 
    flex-direction: column; 
    gap: 10px; 
    min-width: 0; 
  }
  .kolom-titel {
    text-align: center;
    font-size: 13px;
    color: #7f8c8d;
    font-weight: bold;
    margin-bottom: 5px;
    text-transform: uppercase;
  }
  input[type="text"] { 
    width: 100%;
    padding: 12px; 
    font-size: 18px; 
    text-align: center; 
    border: 2px solid #bdc3c7; 
    border-radius: 6px; 
    outline: none; 
    transition: 0.2s;
  }
  input[type="text"]:focus { border-color: #3498db; }
  input.correct { 
    border-color: #2ecc71 !important; 
    background-color: #eafaf1 !important; 
    color: #27ae60;
  }
  input.fout {
    border-color: #e74c3c !important; 
    background-color: #fdedec !important; 
    color: #c0392b;
  }

  .actie-container {
    display: flex;
    justify-content: flex-end; 
    margin-top: 25px;
  }
  .actie-knop {
    padding: 10px 20px;
    font-size: 16px;
    font-weight: bold;
    color: white;
    background-color: #3498db;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.2s;
  }
  .actie-knop:hover { background-color: #2980b9; }

  /* Mobiele Weergave */
  @media (max-width: 768px) {
    .mobiel-header { display: flex; }
    .hoofdinhoud { padding-top: 80px; }
    .zijbalk {
      position: fixed;
      top: 0; left: 0;
      height: 100vh;
      width: 100%;
      transform: translateX(-100%);
      overflow-y: auto;
    }
    .zijbalk.open { transform: translateX(0); }
    .sluit-menu { display: block; }
    .oefen-card { padding: 20px; }
    .grid { gap: 10px; }
    input[type="text"] { padding: 10px; font-size: 16px; }
  }
</style>
</head>
<body>

<div class="mobiel-header">
  <button class="hamburger" id="open-menu">☰</button>
  <div class="mobiel-titel">Latijn Grammatica</div>
</div>

<div class="zijbalk" id="zijbalk">
  <button class="sluit-menu" id="sluit-menu">&larr; Sluiten</button>
  
  <div class="zijbalk-nav">
    <a href="index.html" class="actief">Oefenen</a>
    <a href="toets.html">Toetsen</a>
  </div>
  
  <div class="filter-menu">
    <details open>
      <summary>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
        Filteren
      </summary>
      <div class="filter-groep">
        <strong>Tijden</strong>
        <label><input type="checkbox" name="tijd" value="Praesens" checked> Praesens</label>
        <label><input type="checkbox" name="tijd" value="Imperfectum" checked> Imperfectum</label>
        <label><input type="checkbox" name="tijd" value="Futurum" checked> Futurum</label>
        <label><input type="checkbox" name="tijd" value="Perfectum" checked> Perfectum</label>
        <label><input type="checkbox" name="tijd" value="Plusquamperfectum" checked> Plusquamperfectum</label>
        <label><input type="checkbox" name="tijd" value="Futurum Exactum" checked> Futurum Exactum</label>
      </div>
      <div class="filter-groep">
        <strong>Wijs</strong>
        <label><input type="checkbox" name="wijs" value="Indicativus" checked> Indicativus</label>
        <label><input type="checkbox" name="wijs" value="Conjunctivus" checked> Conjunctivus</label>
      </div>
      <div class="filter-groep">
        <strong>Vorm</strong>
        <label><input type="checkbox" name="vorm" value="Actief" checked> Actief</label>
        <label><input type="checkbox" name="vorm" value="Passief" checked> Passief</label>
      </div>
    </details>
  </div>
</div>

<div class="hoofdinhoud">
  <div id="leeg-bericht" class="leeg-bericht">Selecteer een tijd/wijs/vorm</div>
  
  <div id="oefen-container" class="oefen-card">
    <h2 id="titel-tijd">Laden...</h2>
    <div id="titel-sub" class="schema-subtitel"></div>

    <div class="grid">
      <div class="column">
        <div class="kolom-titel">Enkelvoud</div>
        <input type="text" id="input-0" autocomplete="off">
        <input type="text" id="input-1" autocomplete="off">
        <input type="text" id="input-2" autocomplete="off">
      </div>
      <div class="column">
        <div class="kolom-titel">Meervoud</div>
        <input type="text" id="input-3" autocomplete="off">
        <input type="text" id="input-4" autocomplete="off">
        <input type="text" id="input-5" autocomplete="off">
      </div>
    </div>

    <div class="actie-container">
      <button id="doorgaan-knop" class="actie-knop">Doorgaan &rarr;</button>
    </div>
  </div>
</div>

<script>
  // Mobiel menu toggle
  document.getElementById('open-menu').onclick = () => document.getElementById('zijbalk').classList.add('open');
  document.getElementById('sluit-menu').onclick = () => document.getElementById('zijbalk').classList.remove('open');

  const schema = {
    "Praesens Indicativus Actief": ["o", "s", "t", "mus", "tis", "nt"],
    "Praesens Conjunctivus Actief": ["m", "s", "t", "mus", "tis", "nt"],
    "Imperfectum Indicativus Actief": ["bam", "bas", "bat", "bamus", "batis", "bant"],
    "Imperfectum Conjunctivus Actief": ["rem", "res", "ret", "remus", "retis", "rent"],
    "Futurum Indicativus Actief": ["bo", "bis", "bit", "bimus", "bitis", "bunt"],
    "Perfectum Indicativus Actief": ["i", "isti", "it", "imus", "istis", "erunt"],
    "Perfectum Conjunctivus Actief": ["erim", "eris", "erit", "erimus", "eritis", "erint"],
    "Plusquamperfectum Indicativus Actief": ["eram", "eras", "erat", "eramus", "eratis", "erant"],
    "Plusquamperfectum Conjunctivus Actief": ["issem", "isses", "isset", "issemus", "issetis", "issent"],
    "Futurum Exactum Indicativus Actief": ["ero", "eris", "erit", "erimus", "eritis", "erint"],
    "Praesens Indicativus Passief": ["or", "ris", "tur", "mur", "mini", "ntur"],
    "Praesens Conjunctivus Passief": ["r", "ris", "tur", "mur", "mini", "ntur"],
    "Imperfectum Indicativus Passief": ["bar", "baris", "batur", "bamur", "bamini", "bantur"],
    "Imperfectum Conjunctivus Passief": ["rer", "reris", "retur", "remur", "remini", "rentur"],
    "Futurum Indicativus Passief": ["bor", "beris", "bitur", "bimur", "bimini", "buntur"],
    "Perfectum Indicativus Passief": ["sum", "es", "est", "sumus", "estis", "sunt"],
    "Perfectum Conjunctivus Passief": ["sim", "sis", "sit", "simus", "sitis", "sint"],
    "Plusquamperfectum Indicativus Passief": ["eram", "eras", "erat", "eramus", "eratis", "erant"],
    "Plusquamperfectum Conjunctivus Passief": ["essem", "esses", "esset", "essemus", "essetis", "essent"],
    "Futurum Exactum Indicativus Passief": ["ero", "eris", "erit", "erimus", "eritis", "erunt"]
  };

  const alleTitels = Object.keys(schema);
  let huidigeTitel = "";
  let huidigeAntwoorden = [];
  let correcteAantallen = 0;
  let toonAntwoordenModus = false;
  const inputs = [];

  for (let i = 0; i < 6; i++) {
    inputs.push(document.getElementById(`input-${i}`));
  }

  function splitsTitel(volledigeTitel) {
    const tijden = ["Praesens", "Imperfectum", "Futurum Exactum", "Futurum", "Perfectum", "Plusquamperfectum"];
    let gevondenTijd = "";
    for (let t of tijden) {
      if (volledigeTitel.includes(t)) {
        gevondenTijd = t;
        break;
      }
    }
    return { tijd: gevondenTijd, sub: volledigeTitel.replace(gevondenTijd, "").trim() };
  }

  function startNieuweRonde() {
    toonAntwoordenModus = false;
    document.getElementById('doorgaan-knop').innerHTML = "Doorgaan &rarr;";

    const tijden = Array.from(document.querySelectorAll('input[name="tijd"]:checked')).map(cb => cb.value);
    const wijzen = Array.from(document.querySelectorAll('input[name="wijs"]:checked')).map(cb => cb.value);
    const vormen = Array.from(document.querySelectorAll('input[name="vorm"]:checked')).map(cb => cb.value);

    const gefilterdeTitels = alleTitels.filter(titel => {
      const heeftTijd = tijden.some(t => {
        if (t === "Futurum") return titel.includes("Futurum") && !titel.includes("Exactum");
        return titel.includes(t);
      });
      const heeftWijs = wijzen.some(w => titel.includes(w));
      const heeftVorm = vormen.some(v => titel.includes(v));
      return heeftTijd && heeftWijs && heeftVorm;
    });

    const leegBericht = document.getElementById('leeg-bericht');
    const container = document.getElementById('oefen-container');

    if (gefilterdeTitels.length === 0) {
      container.style.display = 'none';
      leegBericht.style.display = 'block';
      let ontbrekend = [];
      if (tijden.length === 0) ontbrekend.push("tijd");
      if (wijzen.length === 0) ontbrekend.push("wijs");
      if (vormen.length === 0) ontbrekend.push("vorm");
      leegBericht.textContent = ontbrekend.length > 0 ? "Selecteer een " + ontbrekend.join("/") : "Geen resultaten voor deze combinatie";
      return;
    }

    container.style.display = 'block';
    leegBericht.style.display = 'none';

    huidigeTitel = gefilterdeTitels[Math.floor(Math.random() * gefilterdeTitels.length)];
    huidigeAntwoorden = schema[huidigeTitel];
    
    const splitsing = splitsTitel(huidigeTitel);
    document.getElementById('titel-tijd').textContent = splitsing.tijd;
    document.getElementById('titel-sub').textContent = splitsing.sub;
    
    correcteAantallen = 0;

    inputs.forEach(input => {
      input.value = "";
      input.disabled = false;
      input.classList.remove('correct', 'fout');
    });
    inputs[0].focus();
  }

  document.getElementById('doorgaan-knop').onclick = () => {
    if (toonAntwoordenModus) {
      startNieuweRonde();
    } else {
      let allesAlGoed = true;
      inputs.forEach((input, index) => {
        if (input.value.trim().toLowerCase() !== huidigeAntwoorden[index]) {
          allesAlGoed = false;
          input.classList.remove('correct');
          input.classList.add('fout');
          input.value = huidigeAntwoorden[index];
          input.disabled = true;
        }
      });
      
      if (allesAlGoed) {
        startNieuweRonde();
      } else {
        toonAntwoordenModus = true;
        document.getElementById('doorgaan-knop').innerHTML = "Volgende schema &rarr;";
      }
    }
  };

  document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', startNieuweRonde);
  });

  inputs.forEach((input, index) => {
    input.addEventListener('input', (e) => {
      if (toonAntwoordenModus) return; 

      const ingevuldeWaarde = e.target.value.trim().toLowerCase();
      if (ingevuldeWaarde === huidigeAntwoorden[index]) {
        input.classList.add('correct');
        input.disabled = true;
        correcteAantallen++;
        if (correcteAantallen === 6) {
          setTimeout(startNieuweRonde, 800);
        } else {
          let nextIndex = (index + 1) % 6;
          while (inputs[nextIndex].disabled && correcteAantallen < 6) {
             nextIndex = (nextIndex + 1) % 6;
          }
          inputs[nextIndex].focus();
        }
      }
    });
  });

  startNieuweRonde();
</script>
</body>
</html>
